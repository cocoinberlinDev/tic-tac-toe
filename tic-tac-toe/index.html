<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <h1>Tic-Tac-Toe</h1>

    <p id="status-message" class="status-message" role="status" aria-live="polite">
      Player 1's turn (X)
    </p>

    <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board">
      <!-- Cells are generated by tic_tac_toe_view.js. -->
    </div>

    <button id="restart-button" class="restart-button" type="button">
      Restart Game
    </button>
  </main>

  <script type="module" src="tic_tac_toe_view.js"></script>
</body>
</html>
